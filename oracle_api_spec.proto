syntax = "proto3";

package qubic.deterministic.oracle.v1;

option go_package = "qubic/deterministic/oracle/v1;oraclev1";
option java_multiple_files = true;
option java_package = "org.qubic.deterministic.oracle.v1";

// ============================================================================
// Deterministic Causal Inference Oracle Service for Qubic Layer 1 & Aigarth
// Zero-hallucination, sub-millisecond execution with Level-0 Formal Verification
// ============================================================================
service DeterministicOracleService {
  // Verifies a formal proof or transaction payload with Level-0 Kernel guarantees
  rpc VerifyProof (VerifyProofRequest) returns (VerifyProofResponse);

  // High-frequency stream for Computors and active inference state sync
  rpc StreamInference (stream InferenceStreamRequest) returns (stream InferenceStreamResponse);

  // Query oracle status, empirical silicon benchmarks, and active test suites
  rpc GetOracleTelemetry (TelemetryRequest) returns (TelemetryResponse);
}

enum DomainVertical {
  DOMAIN_VERTICAL_UNSPECIFIED = 0;
  DEFI_HIGH_FREQUENCY = 1;       // Liquidation, collateral arbitration, slippage bounds
  MEDICAL_CLAIM_AUDIT = 2;       // Biophysical clinical rules, ICD/CPT billing validation
  LEGAL_FORMAL_AUDIT = 3;        // Smart contract invariance, jurisdictional compliance
  UPOW_VARIATIONAL_INFERENCE = 4;// Free energy minimization tasks for miners
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  STATUS_VERIFIED_SUCCESS = 1;   // 100% formal proof validated, zero hallucination
  STATUS_FAIL_CLOSED_VETO = 2;   // VOID_AB_INITIO: Axiom violated, state transition rejected
  STATUS_TIMEOUT_EXCEEDED = 3;   // Execution budget exceeded (< 0.01ms SLA)
}

message VerifyProofRequest {
  string request_id = 1;                 // Unique UUID v4
  DomainVertical vertical = 2;           // Industry vertical / target state space
  string transaction_hash = 3;           // Qubic L1 transaction identifier
  bytes formal_payload = 4;              // Serialized Lean/formal expression or AST
  uint64 max_latency_nanoseconds = 5;    // Hard SLA (Default: 10,000 ns = 0.01 ms)
  string qubic_caller_address = 6;       // Calling Computor or dApp identity
}

message VerifyProofResponse {
  string request_id = 1;
  VerificationStatus status = 2;
  string error_code = 3;                 // E.g. "VOID_AB_INITIO_AXIOM_2_VIOLATION" if rejected
  double measured_latency_us = 4;        // Measured silicon execution time (e.g. 7.4 microseconds)
  string sha256_proof_attestation = 5;   // Cryptographic proof hash
  bytes proof_certificate = 6;           // Lean-verifiable proof certificate
  uint64 microfee_qubic_deducted = 7;     // Micro-fee charged in $QUBIC
  int64 timestamp_epoch = 8;
}

message InferenceStreamRequest {
  string computor_id = 1;
  uint64 epoch_index = 2;
  bytes variational_state_vector = 3;    // Active inference prior (F -> 0)
}

message InferenceStreamResponse {
  uint64 epoch_index = 1;
  bytes updated_free_energy_gradient = 2;
  bool convergence_achieved = 3;
  double free_energy_value = 4;
}

message TelemetryRequest {
  bool include_suite_breakdown = 1;
}

message TestSuiteMetric {
  string suite_name = 1;                 // E.g. "TypeInvarianceSuite", "MemorySafetyBounds"
  bool passed = 2;
  uint32 tests_count = 3;
  double avg_execution_us = 4;
}

message TelemetryResponse {
  string oracle_version = 1;             // E.g. "2.0.0-silicon-l0"
  double average_latency_us = 2;         // Running average (< 10 us)
  double hallucination_rate = 3;         // Strictly 0.000000%
  uint32 total_suites_passed = 4;        // 22
  uint32 total_suites_count = 5;         // 22
  repeated TestSuiteMetric test_suites = 6;
  uint64 total_verified_transactions = 7;
}
